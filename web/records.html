<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Line records</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; background: #11161c; color: #dfe6ee; }
header { padding: 16px 24px; background: #182029; border-bottom: 1px solid #26313d; }
h1 { font-size: 18px; margin: 0 0 4px; }
h2 { font-size: 14px; margin: 18px 0 8px; }
nav a { color: #7fb2e6; margin-right: 16px; text-decoration: none; font-size: 13px; }
section { padding: 16px 24px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #232e39; vertical-align: top; }
code { color: #9fc7ee; }
input { background: #0d1218; color: #dfe6ee; border: 1px solid #2b3946; padding: 5px 8px; border-radius: 4px; }
button { background: #26445f; color: #dfe6ee; border: 1px solid #35566f; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
label { font-size: 13px; margin-left: 8px; }
.bad { color: #e08070; }
.muted { color: #8a97a5; font-size: 12px; }
tr.void td, tr.tombstone td { color: #8a97a5; }
tr.void td:first-child::after { content: " 作废"; color: #e08070; font-size: 11px; margin-left: 6px; }
tr.tombstone td:first-child::after { content: " 作废标记"; color: #c9a15e; font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>Records</h1>
  <nav><a href="/">overview</a><a href="/operations">operations</a><a href="/records">records</a></nav>
</header>
<section>
  <div>
    <input id="kind" placeholder="kind" size="16">
    <input id="origin" placeholder="origin" size="10">
    <input id="limit" value="50" size="4">
    <label><input type="checkbox" id="tombstones"> 看作废标记</label>
    <button id="load">load</button>
  </div>
  <p id="summary" class="muted"></p>
  <h2>有效台账</h2>
  <table>
    <thead><tr><th>seq</th><th>kind</th><th>origin</th><th>gen</th><th>tick</th><th>payload</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <h2 id="void-heading" class="bad">已作废（不计入有效台账）</h2>
  <table>
    <thead><tr><th>seq</th><th>kind</th><th>origin</th><th>gen</th><th>tick</th><th>payload</th></tr></thead>
    <tbody id="void-rows"></tbody>
  </table>

  <h2>历史时刻</h2>
  <div>
    <input id="as-of-tick" placeholder="tick" size="10">
    <button id="as-of">查该时刻状态</button>
  </div>
  <p id="history-summary" class="muted"></p>
  <pre id="history-state" class="muted"></pre>
</section>
<script id="bootstrap" type="application/json"><!--STATE--></script>
<script>
function addRow(rows, record, extraClass) {
  const row = document.createElement('tr');
  if (extraClass) row.className = extraClass;
  row.innerHTML = `<td>${record.seq}</td><td><code>${record.kind}</code></td>` +
    `<td>${record.origin}</td><td>${record.generation}</td><td>${record.tick}</td>` +
    `<td><code>${JSON.stringify(record.payload)}</code></td>`;
  rows.appendChild(row);
}

function render(result) {
  document.getElementById('summary').textContent =
    `有效 ${result.effective_total} 条；已作废 ${result.voided_total} 条` +
    (result.tombstone_total ? `；作废标记 ${result.tombstone_total} 条` : '') +
    `；按类型 ${JSON.stringify(result.by_kind)}`;
  const rows = document.getElementById('rows');
  const voidRows = document.getElementById('void-rows');
  rows.innerHTML = '';
  voidRows.innerHTML = '';
  result.records.forEach((record) => {
    if (record.status === 'effective') {
      addRow(rows, record);
    } else if (record.status === 'void') {
      addRow(voidRows, record, 'void');
    } else if (record.status === 'tombstone') {
      addRow(voidRows, record, 'tombstone');
    }
  });
  document.getElementById('void-heading').textContent =
    `已作废（不计入有效台账）· ${result.voided_total + result.tombstone_total} 条`;
}
render(JSON.parse(document.getElementById('bootstrap').textContent));
document.getElementById('load').addEventListener('click', function () {
  const params = new URLSearchParams();
  const kind = document.getElementById('kind').value;
  const origin = document.getElementById('origin').value;
  const limit = document.getElementById('limit').value;
  if (kind) params.set('kind', kind);
  if (origin) params.set('origin', origin);
  if (limit) params.set('limit', limit);
  if (document.getElementById('tombstones').checked) params.set('include_tombstones', 'true');
  fetch('/api/records?' + params.toString()).then((r) => r.json()).then(render);
});

document.getElementById('as-of').addEventListener('click', function () {
  const tick = document.getElementById('as-of-tick').value;
  if (!tick) return;
  fetch('/api/history?tick=' + encodeURIComponent(tick)).then((r) => r.json()).then((payload) => {
    const delta = payload.delta;
    document.getElementById('history-summary').textContent =
      `tick ${payload.tick}（当前 ${payload.now}）：新增 ${delta.added.length} 项，` +
      `变化 ${delta.changed.length} 项，移除 ${delta.removed.length} 项`;
    document.getElementById('history-state').textContent = JSON.stringify(payload.state, null, 2);
  });
});
</script>
</body>
</html>
